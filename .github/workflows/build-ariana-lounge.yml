name: Build Chatterino7 Ariana Lounge Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-ariana-lounge-${{ github.ref }}
  cancel-in-progress: true

env:
  CONAN_VERSION: 2.11.0

jobs:
  build-windows:
    name: "Build Windows x64 (Ariana Lounge)"
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Setup Python BEFORE cloning upstream: setup-python's pip cache
      # step stats the whole workspace, and upstream's
      # lib/settings/tests/files/realpath/symlink-recursive-bar is a
      # recursive symlink that fails with ELOOP. No cache: pip either -
      # there is no requirements file to cache, conan is installed later.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Clone upstream Chatterino7
        shell: pwsh
        run: |
          git clone https://github.com/SevenTV/chatterino7.git upstream
          cd upstream
          git checkout 910b01dd428c4ac042028708704278b93227491b
          git submodule update --init --recursive

      # Run #1 FAILED SILENTLY here: git apply failed on the binary-JPG
      # hunk ("git diff header lacks filename information") but the step
      # exited 0, so the run built stock Chatterino7 and shipped it as
      # Ariana Lounge. The patch is now TEXT-ONLY (the JPG ships as a
      # separate repo file, copied in by the next step), and this step
      # now throws on ANY failure and verifies the patch actually landed.
      - name: Apply Ariana Lounge patch
        shell: pwsh
        run: |
          Copy-Item ariana-lounge.patch upstream/ariana-lounge.patch
          cd upstream
          if (Select-String -Path ariana-lounge.patch -Pattern "GIT binary patch" -Quiet) { throw "Patch still contains a binary hunk — it must be text-only" }
          git apply ariana-lounge.patch
          if ($LASTEXITCODE -ne 0) { throw "git apply ariana-lounge.patch FAILED with exit code $LASTEXITCODE — patch did not land, stopping the build" }
          if (-not (Test-Path src/widgets/ArianaLounge.cpp)) { throw "Patch did NOT land: src/widgets/ArianaLounge.cpp is missing" }
          if (-not (Test-Path src/widgets/ArianaLoadingScreen.cpp)) { throw "Patch did NOT land: src/widgets/ArianaLoadingScreen.cpp is missing" }
          if (-not (Test-Path src/widgets/ArianaMusic.cpp)) { throw "Patch did NOT land: src/widgets/ArianaMusic.cpp is missing" }
          if (-not (Test-Path src/widgets/ArianaMusicBar.hpp)) { throw "Patch did NOT land: src/widgets/ArianaMusicBar.hpp is missing" }
          if (-not (Test-Path resources/themes/ArianaSweetener.json)) { throw "Patch did NOT land: resources/themes/ArianaSweetener.json is missing" }
          git status --short
          git diff --stat
          # NOTE: git diff only lists TRACKED files (14) — the 20 new
          # files are untracked, so count via git status instead. The
          # patch file itself (ariana-lounge.patch, copied into upstream/
          # above) is untracked too, so exclude it from the count.
          $changed = (git status --porcelain | Where-Object { $_ -notmatch 'ariana-lounge\.patch' } | Measure-Object -Line).Lines
          if ($changed -ne 34) { throw "Patch landed $changed files, expected 34 — stopping the build" }
          Write-Host "Patch landed: $changed files"

      # The loading-screen JPG is NOT in the patch (a binary hunk broke
      # git apply in run #1). It ships as ariana-loading-screen.jpg at
      # the repo root and is copied into upstream/resources/ here, BEFORE
      # the Build step, so Chatterino's generate_resources.cmake glob
      # embeds it as :/ariana-loading-screen.jpg. The SHA-256 is checked
      # so a wrong or corrupt image can never ship silently.
      - name: Copy loading-screen image
        shell: pwsh
        run: |
          $expected = "049a088a309fdf03f1bdfdafc4bb6f18fccb198db2e6d2676496ce52080990e2"
          if (-not (Test-Path ariana-loading-screen.jpg)) { throw "ariana-loading-screen.jpg is missing from the repo root" }
          $actual = (Get-FileHash ariana-loading-screen.jpg -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "ariana-loading-screen.jpg SHA-256 mismatch: got $actual, expected $expected" }
          Copy-Item ariana-loading-screen.jpg upstream/resources/ariana-loading-screen.jpg -Force
          $copied = (Get-FileHash upstream/resources/ariana-loading-screen.jpg -Algorithm SHA256).Hash.ToLower()
          if ($copied -ne $expected) { throw "Copied JPG SHA-256 mismatch: got $copied" }
          Write-Host "Loading-screen JPG verified and copied, SHA-256 $copied"

      # Qt Multimedia is needed for the Ariana Lounge background music
      # (QMediaPlayer + QAudioOutput). The Qt cache key is bumped to
      # v2 so a cached Qt without the multimedia module is not reused.
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4.3.0
        with:
          cache: true
          cache-key-prefix: windows-qt-6.9.3-v2
          modules: qtimageformats qtmultimedia
          version: 6.9.3
          arch: win64_msvc2022_64
          setup-python: false

      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: sccache-build-windows-x64-6.9.3-arianalounge
          restore-keys: |
            sccache-build-windows-x64

      - name: Cache conan packages
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-conan-user-QT6-arianalounge
          path: ~/.conan2/
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-conan-user-

      # NOTE: Upstream "Prepare release auth config" step is intentionally
      # SKIPPED here. It throws if MRAB/PHGTK secrets are missing, and
      # those secrets are not set in this repo and must not fail the build.
      # The app builds and runs without the release auth blob; YouTube
      # auth falls back to the MRAB environment variable at runtime.

      - name: Install and setup Conan
        shell: bash
        run: |
          pip install conan==${{ env.CONAN_VERSION }}
          conan --version
          conan profile detect -f

      - name: Install dependencies
        shell: bash
        working-directory: upstream
        run: |
          mkdir build
          cd build
          conan install .. \
            -s build_type=Release \
            -c tools.cmake.cmaketoolchain:generator="Ninja" \
            -b missing \
            --output-folder=. \
            -o with_openssl3=True

      - name: Build
        shell: pwsh
        working-directory: upstream
        run: |
          cd build
          cmake `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="conan_toolchain.cmake" `
            -DUSE_PRECOMPILED_HEADERS=ON `
            -DCHATTERINO_LTO=OFF `
            -DFORCE_JSON_GENERATION=Off `
            -DCHATTERINO_SPELLCHECK=Off `
            ..
          ninja

      - name: Package
        working-directory: upstream/build
        shell: pwsh
        run: |
          $packageDir = "Chatterino7ArianaLounge"
          if (Test-Path $packageDir) {
            Remove-Item $packageDir -Recurse -Force
          }
          windeployqt bin/chatterino.exe --release --no-compiler-runtime --no-translations --no-opengl-sw --dir $packageDir --force-openssl
          Copy-Item bin/chatterino.exe $packageDir/Chatterino7ArianaLounge.exe
          Remove-Item $packageDir/chatterino.exe -ErrorAction SilentlyContinue
          Get-ChildItem bin -Filter '*.dll' | Copy-Item -Destination $packageDir -Force
          ..\.CI\deploy-crt.ps1 $packageDir
          if (Test-Path "Chatterino7ArianaLounge.zip") {
            Remove-Item "Chatterino7ArianaLounge.zip" -Force
          }
          7z a Chatterino7ArianaLounge.zip .\$packageDir\*

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v7
        with:
          name: Chatterino7ArianaLounge.zip
          path: upstream/build/Chatterino7ArianaLounge.zip

      - name: Upload artifact (exe)
        uses: actions/upload-artifact@v7
        with:
          name: Chatterino7ArianaLounge.exe
          path: upstream/build/Chatterino7ArianaLounge/Chatterino7ArianaLounge.exe
